# SST-2 / BERT-base-uncased MULTI-EXIT (exits at layers [4, 8, 12]).
#
# Companion to glue_sst2_bert_base_singleexit.yaml. Only run if the single-exit
# control reaches >= 0.88 — otherwise this config inherits the same pipeline issue.
#
# Exit placement at 4 / 8 / 12 = approximately 1/3, 2/3, 3/3 of the 12-layer stack;
# matches the SDN compute-fraction convention used on image cells.

name: glue_sst2_bert_base_multiexit
seed: 42

data:
  name: glue
  task: sst2
  root: ./data/glue
  num_classes: 2
  in_channels: 1
  batch_size: 32
  num_workers: 2
  max_len: 128

model:
  name: bert_early_exit
  pretrained_name: bert-base-uncased
  exit_layers: [3, 6, 12]
  dropout: 0.1

loss:
  method: jolt
  use_b: true
  use_multitask: true
  divide_b: 10.0

train:
  epochs: 3
  lr: 0.00002
  schedule: cosine
  warmup_epochs: 0
  weight_decay: 0.01
  momentum: 0.9
  nesterov: false
  ema_decay: 0.0
  mixup_alpha: 0.0
  cutmix_alpha: 0.0
  eta_lr: 0.0001
  grad_clip: 1.0

eval:
  cutoff_type: entropy

diagnostics:
  enabled: false
